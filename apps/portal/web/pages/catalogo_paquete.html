<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configurar catálogo — GlobMarket B2B</title>
    <meta name="description" content="Agrega o quita productos del catálogo y calcula el precio del paquete." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['IBM Plex Sans', 'ui-sans-serif', 'system-ui'], display: ['Manrope', 'IBM Plex Sans', 'sans-serif'] },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="/css/app.css?v=81" />
  </head>

  <body class="font-sans bg-slate-50 text-slate-800">
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-3"></div>

    <header class="gm-header sticky top-0 z-40"></header>

    <main class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 py-10">
      <a href="/pages/catalogos.html" class="text-sm font-semibold text-blue-700 hover:text-blue-800 transition">← Todos los catálogos</a>

      <div id="paquete-head" class="mt-4 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
        <div class="flex flex-wrap items-end justify-between gap-4">
          <div>
            <h1 id="paq-nombre" class="text-3xl font-extrabold text-slate-900 tracking-tight">Catálogo</h1>
            <p id="paq-descripcion" class="mt-2 text-sm text-slate-600 max-w-2xl"></p>
            <div id="paq-meta" class="hidden mt-3 flex flex-wrap items-center gap-2"></div>
          </div>
          <div class="text-right">
            <div class="text-xs uppercase font-semibold text-slate-500">Total del paquete</div>
            <div id="paq-total" class="text-3xl font-extrabold text-blue-700">—</div>
            <div id="paq-resumen" class="text-xs text-slate-500 mt-1"></div>
          </div>
        </div>
      </div>

      <div class="mt-6 flex flex-wrap items-center justify-between gap-3">
        <p class="text-sm text-slate-600">
          Usa <b>0</b> para quitar un producto del paquete. El precio se recalcula automáticamente con cada cambio.
        </p>
        <div class="flex gap-2">
          <button id="paq-reset" type="button" class="px-5 py-2.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 hover:border-slate-300 transition text-sm font-semibold text-slate-700">Restablecer cantidades</button>
          <button id="paq-add" type="button" class="px-6 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 transition shadow-sm">Agregar al carrito</button>
        </div>
      </div>

      <div id="paquete-lista" class="mt-4 space-y-3"></div>
      <div id="paquete-error" class="hidden mt-4 rounded-2xl border border-rose-200 bg-rose-50 p-5 text-sm text-rose-700"></div>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/js/app.js?v=88"></script>
    <script src="/js/carrito.js?v=81"></script>
    <script src="/js/paquete.js?v=3"></script>
  </body>
</html>
