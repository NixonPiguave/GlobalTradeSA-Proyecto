<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogos — GlobMarket B2B</title>
    <meta name="description" content="Compra por catálogo: paquetes configurables con varios productos y cantidades a tu medida." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['IBM Plex Sans', 'ui-sans-serif', 'system-ui'], display: ['Manrope', 'IBM Plex Sans', 'sans-serif'] },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="/css/app.css?v=81" />
  </head>

  <body class="font-sans bg-slate-50 text-slate-800">
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-3"></div>

    <header class="gm-header sticky top-0 z-40"></header>

    <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-10">
      <div class="flex items-end justify-between gap-4">
        <div>
          <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Catálogos / paquetes</h1>
          <p class="mt-2 text-sm text-slate-600">
            Compra un catálogo completo y configura las cantidades: agrega o quita productos y el precio se recalcula al instante.
          </p>
        </div>
      </div>
      <div id="catalogos-grid" class="mt-6 grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      <div id="catalogos-error" class="hidden mt-6 rounded-2xl border border-rose-200 bg-rose-50 p-5 text-sm text-rose-700"></div>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/js/app.js?v=89"></script>
    <script src="/js/carrito.js?v=82"></script>
    <script src="/js/catalogos.js?v=6"></script>
  </body>
</html>
