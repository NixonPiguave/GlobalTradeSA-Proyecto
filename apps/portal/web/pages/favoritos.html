<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favoritos — GlobMarket B2B</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { fontFamily: { sans: ['IBM Plex Sans', 'ui-sans-serif', 'system-ui'], display: ['Manrope', 'IBM Plex Sans', 'sans-serif'] } } } };
    </script>
    <link rel="stylesheet" href="/css/app.css?v=81" />
  </head>
  <body class="font-sans bg-slate-50 text-slate-800">
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-3"></div>
    <header class="gm-header sticky top-0 z-40"></header>
    <main class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8 py-8">
      <h1 class="text-xl font-bold text-slate-800 font-display">Favoritos</h1>
      <p class="mt-1 text-sm text-slate-500">Productos y paquetes guardados para reordenar rápido.</p>

      <div class="mt-5 inline-flex rounded-xl border border-slate-200 bg-white p-1">
        <button type="button" data-tab="productos" class="px-4 py-2 rounded-lg text-sm font-semibold transition bg-slate-900 text-white">Productos</button>
        <button type="button" data-tab="paquetes" class="px-4 py-2 rounded-lg text-sm font-semibold transition text-slate-600 hover:text-slate-900">Paquetes</button>
      </div>

      <div id="wish-lista" class="mt-6 space-y-3"></div>
      <div id="wish-paquetes" class="mt-6 hidden grid gap-4 sm:grid-cols-2"></div>
    </main>
    <script src="/js/app.js?v=88"></script>
    <script src="/js/carrito.js?v=81"></script>
    <script>
      (function () {
        if (!getToken()) { window.location.href = '/pages/login.html'; return; }

        const wrapProd = document.getElementById('wish-lista');
        const wrapPack = document.getElementById('wish-paquetes');
        const tabs = document.querySelectorAll('[data-tab]');

        function activarTab(nombre) {
          tabs.forEach((b) => {
            const activo = b.dataset.tab === nombre;
            b.className = `px-4 py-2 rounded-lg text-sm font-semibold transition ${activo ? 'bg-slate-900 text-white' : 'text-slate-600 hover:text-slate-900'}`;
          });
          wrapProd.classList.toggle('hidden', nombre !== 'productos');
          wrapPack.classList.toggle('hidden', nombre !== 'paquetes');
        }
        tabs.forEach((b) => b.addEventListener('click', () => activarTab(b.dataset.tab)));

        async function cargarProductos() {
          try {
            const items = await apiFetch('/api/wishlist', { auth: true });
            if (!items.length) {
              wrapProd.innerHTML = '<div class="rounded-xl border border-slate-200 bg-white p-8 text-center text-sm text-slate-500">Aún no tienes productos favoritos. En el catálogo usa el icono ♡.</div>';
              return;
            }
            wrapProd.innerHTML = items.map((p) => `
              <div class="rounded-xl border border-slate-200 bg-white p-4 flex flex-wrap items-center justify-between gap-3">
                <div class="min-w-0">
                  <div class="text-sm font-semibold text-slate-900">${escapeHtml(nombreProductoEs(p.nombre_producto))}</div>
                  <div class="text-xs text-slate-500 mt-0.5">${escapeHtml(p.marca || '')} · ${escapeHtml(p.linea || '')} · MOQ según configuración</div>
                  <div class="text-sm font-bold text-slate-800 mt-1">${formatUsd(p.precio_mayorista ?? p.precio_unitario)}</div>
                </div>
                <div class="flex gap-2">
                  <button type="button" class="px-3 py-1.5 rounded-lg bg-slate-800 text-white text-xs font-semibold" data-add="${p.id_producto}" data-moq="${Math.max(1, Number(p.moq_mayorista) || 10)}">Al carrito</button>
                  <button type="button" class="px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-semibold" data-del="${p.id_producto}">Quitar</button>
                </div>
              </div>`).join('');
            wrapProd.querySelectorAll('[data-add]').forEach((b) => b.addEventListener('click', async () => {
              const qty = Math.max(1, Number(b.dataset.moq) || 10);
              await window.gmCarrito?.agregar(Number(b.dataset.add), qty);
            }));
            wrapProd.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', async () => {
              await apiFetch('/api/wishlist/' + b.dataset.del, { method: 'DELETE', auth: true });
              showToast('success', 'Quitado de favoritos');
              cargarProductos();
            }));
          } catch (e) {
            wrapProd.innerHTML = `<div class="text-sm text-red-600">${escapeHtml(e.message)}</div>`;
          }
        }

        async function cargarPaquetes() {
          try {
            const items = await apiFetch('/api/wishlist/catalogos', { auth: true });
            if (!items.length) {
              wrapPack.innerHTML = '<div class="sm:col-span-2 rounded-xl border border-slate-200 bg-white p-8 text-center text-sm text-slate-500">Aún no tienes paquetes favoritos. Guárdalos desde la vista de catálogos.</div>';
              return;
            }
            wrapPack.innerHTML = items.map((c) => {
              const dto = Number(c.descuento_pct || 0);
              const base = Number(c.precio_total_base || 0);
              const final = Number(c.precio_total_final ?? base);
              const precio = dto > 0 && final < base
                ? `<span class="text-lg font-extrabold text-emerald-700">${formatUsd(final)}</span> <span class="text-xs text-slate-400 line-through">${formatUsd(base)}</span>`
                : `<span class="text-lg font-extrabold text-slate-900">${formatUsd(base)}</span>`;
              return `
              <div class="rounded-2xl border border-slate-200 bg-white p-4 flex flex-col gap-3">
                <div>
                  <div class="flex items-start justify-between gap-2">
                    <div class="text-sm font-bold text-slate-900">${escapeHtml(String(c.nombre || 'Paquete'))}</div>
                    ${dto > 0 ? `<span class="shrink-0 rounded-full bg-rose-600 px-2 py-0.5 text-[10px] font-bold text-white">-${dto}%</span>` : ''}
                  </div>
                  <div class="text-xs text-slate-500 mt-0.5">${Number(c.n_productos || 0)} productos${Number(c.n_agotados || 0) > 0 ? ` · <span class="font-semibold text-amber-700">${Number(c.n_agotados)} agotados en tu zona</span>` : ''}</div>
                  <div class="mt-2">${precio}</div>
                </div>
                <div class="mt-auto flex gap-2">
                  <a href="/pages/catalogo_paquete.html?id=${c.id_catalogo}" class="flex-1 text-center px-3 py-1.5 rounded-lg bg-blue-600 text-white text-xs font-semibold">Configurar</a>
                  <button type="button" class="px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-semibold" data-del-pack="${c.id_catalogo}">Quitar</button>
                </div>
              </div>`;
            }).join('');
            wrapPack.querySelectorAll('[data-del-pack]').forEach((b) => b.addEventListener('click', async () => {
              await apiFetch('/api/wishlist/catalogos/' + b.dataset.delPack, { method: 'DELETE', auth: true });
              showToast('success', 'Paquete quitado de favoritos');
              cargarPaquetes();
            }));
          } catch (e) {
            wrapPack.innerHTML = `<div class="sm:col-span-2 text-sm text-red-600">${escapeHtml(e.message)}</div>`;
          }
        }

        activarTab('productos');
        cargarProductos();
        cargarPaquetes();
      })();
    </script>
  </body>
</html>
