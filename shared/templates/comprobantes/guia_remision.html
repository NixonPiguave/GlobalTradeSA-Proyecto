{% extends "base.html" %}
{% block content %}
<div class="section">
  <h2>Destino</h2>
  <div class="info-grid">
    <div><strong>Cliente:</strong> {{ cliente.empresa }}</div>
    <div><strong>Pedido:</strong> {{ pedido.numero }}</div>
    <div><strong>Dirección:</strong> {{ direccion or '—' }}</div>
  </div>
</div>
<table class="lines">
  <thead><tr><th>Producto</th><th class="num">Cantidad enviada</th></tr></thead>
  <tbody>{% for i in items %}<tr><td>{{ i.producto }}</td><td class="num">{{ i.cantidad }}</td></tr>{% endfor %}</tbody>
</table>
{% endblock %}
