<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo — GlobMarket B2B</title>
    <meta name="description" content="Catálogo mayorista por categorías. Filtra productos y revisa precios mayoristas." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'Roboto', 'Arial'] },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="/css/app.css?v=3" />
  </head>

  <body class="font-sans bg-slate-50 text-slate-800">
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-3"></div>

    <header class="sticky top-0 z-40 border-b border-slate-200 bg-white/80 backdrop-blur supports-[backdrop-filter]:bg-white/70">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="flex h-16 items-center justify-between">
          <a href="/" class="flex items-center gap-3">
            <div class="h-10 w-10 rounded-2xl bg-blue-600 flex items-center justify-center shadow-sm">
              <span class="text-white font-extrabold">G</span>
            </div>
            <div class="leading-tight">
              <div class="text-sm font-extrabold text-slate-900 tracking-tight">GlobMarket <span class="text-blue-700">B2B</span></div>
              <div class="text-xs text-slate-500">Catálogo mayorista</div>
            </div>
          </a>
          <nav class="flex items-center gap-2">
            <a data-nav-login href="/pages/login.html" class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-700 hover:text-slate-900 hover:bg-slate-50 transition">Iniciar sesión</a>
            <a data-nav-registro href="/pages/registro.html" class="px-4 py-2 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 transition shadow-sm">Registrarse</a>
            <button data-nav-logout class="hidden px-4 py-2 rounded-xl border border-slate-200 bg-white hover:border-blue-200 transition text-sm font-semibold">Cerrar sesión</button>
          </nav>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-10">
      <div class="flex flex-col lg:flex-row gap-8">
        <aside class="lg:w-72">
          <details id="filtros" class="group lg:sticky lg:top-20 rounded-3xl border border-slate-200 bg-white shadow-sm overflow-hidden">
            <summary class="lg:hidden cursor-pointer flex items-center justify-between gap-3 px-5 py-4 hover:bg-slate-50 transition">
              <span class="flex items-center gap-2 text-sm font-extrabold text-slate-900">
                <i data-lucide="sliders-horizontal" class="h-4 w-4 text-blue-600"></i>
                Filtros y categorías
              </span>
              <i data-lucide="chevron-down" class="h-4 w-4 text-slate-500 transition-transform group-open:rotate-180"></i>
            </summary>
            <div class="px-5 pb-5 lg:pt-5">
              <div class="hidden lg:block text-sm font-extrabold text-slate-900">Filtros</div>
              <div class="mt-0 lg:mt-4" id="categorias-sidebar"></div>
            </div>
          </details>
        </aside>

        <section class="flex-1">
          <div class="flex items-end justify-between gap-4">
            <div>
              <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Catálogo de productos</h1>
              <p class="mt-2 text-sm text-slate-600">Precios mayoristas y productos listos para compra por volumen.</p>
            </div>
          </div>

          <div id="productos-grid" class="mt-6 grid sm:grid-cols-2 xl:grid-cols-3 gap-4"></div>

          <div id="productos-pager" class="mt-8"></div>
        </section>
      </div>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/js/app.js?v=3"></script>
  </body>
</html>
