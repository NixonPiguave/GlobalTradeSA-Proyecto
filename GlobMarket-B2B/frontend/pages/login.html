<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión — GlobMarket B2B</title>
    <meta name="description" content="Accede a tu cuenta empresarial para realizar pedidos mayoristas." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'Roboto', 'Arial'] },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="/css/app.css?v=3" />
  </head>

  <body class="font-sans bg-slate-50 text-slate-800">
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-3"></div>

    <header class="sticky top-0 z-40 border-b border-slate-200 bg-white/80 backdrop-blur supports-[backdrop-filter]:bg-white/70">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="flex h-16 items-center justify-between">
          <a href="/" class="flex items-center gap-3">
            <div class="h-10 w-10 rounded-2xl bg-blue-600 flex items-center justify-center shadow-sm">
              <span class="text-white font-extrabold">G</span>
            </div>
            <div class="text-sm font-extrabold text-slate-900 tracking-tight">GlobMarket <span class="text-blue-700">B2B</span></div>
          </a>
          <nav class="flex items-center gap-2">
            <a href="/pages/catalogo.html" class="px-4 py-2 rounded-xl border border-slate-200 bg-white hover:border-blue-200 transition text-sm font-semibold">Catálogo</a>
            <a data-nav-registro href="/pages/registro.html" class="px-4 py-2 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 transition shadow-sm">Registrarse</a>
            <button data-nav-logout class="hidden px-4 py-2 rounded-xl border border-slate-200 bg-white hover:border-blue-200 transition text-sm font-semibold">Cerrar sesión</button>
          </nav>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-12">
      <div class="max-w-md mx-auto">
        <div class="rounded-3xl border border-slate-200 bg-white shadow-sm p-6 sm:p-8">
          <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Iniciar sesión</h1>
          <p class="mt-2 text-sm text-slate-600">Accede con tu email empresarial para ver precios mayoristas y pedidos.</p>

          <form id="login-form" class="mt-6 space-y-4" novalidate>
            <div id="login-msg" class="hidden"></div>
            <div>
              <label class="text-sm font-semibold text-slate-700">Email</label>
              <input id="email" type="email" required placeholder="empresa@correo.com"
                class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200" />
            </div>

            <div>
              <label class="text-sm font-semibold text-slate-700">Contraseña</label>
              <input id="password" type="password" required placeholder="••••••••"
                class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200" />
            </div>

            <button id="login-submit" type="submit"
              class="gm-press w-full rounded-xl bg-blue-600 text-white px-4 py-3 font-semibold hover:bg-blue-700 transition shadow-sm">
              Ingresar
            </button>

            <div class="text-xs text-slate-500">
              ¿Aún no tienes cuenta? <a href="/pages/registro.html" class="text-blue-700 font-semibold hover:text-blue-800">Regístrate aquí</a>.
            </div>
          </form>
        </div>
      </div>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/js/app.js?v=3"></script>
  </body>
</html>
